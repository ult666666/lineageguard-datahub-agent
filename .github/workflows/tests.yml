name: Verified demo and MCP tests
# All application calls use synthetic fixtures or a loopback-only mock server.
# No tenant credentials, catalog writes, schema migrations, deployment, or paid inference.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lineageguard-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Offline tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      DATAHUB_MCP_URL: ''
      DATAHUB_MCP_TOKEN: ''
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Run the complete dependency-free test suite
        run: npm test
      - name: Exercise the local mock MCP transport
        run: npm run mcp:smoke
