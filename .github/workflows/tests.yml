name: Studio and MCP verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lineageguard-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Offline tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      DATAHUB_MCP_URL: ''
      DATAHUB_MCP_TOKEN: ''
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Full suite including SQLite interruption and recovery
        run: npm test
      - name: Read-only loopback MCP handshake
        run: npm run mcp:smoke
      - name: Execute named synthetic evaluations
        run: npm run studio:evaluate
      - name: Build and verify the exact public static payload
        run: npm run build && node scripts/build-studio.mjs --verify dist
  browser:
    name: Studio browser workflows
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: 'true'
      DATAHUB_MCP_URL: ''
      DATAHUB_MCP_TOKEN: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install pinned development tools without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check formatting of the Studio implementation
        run: npm run format:check
      - name: Install Chromium for isolated browser tests
        run: npx playwright install --with-deps chromium
      - name: Real browser-session and durable-local workflows
        run: npm run test:browser
